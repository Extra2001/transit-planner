name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 干净检出：没有 data/changchun/raw、没有受限城市数据，必须也能通过
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Data schema validation
        run: npm run data:validate

      - name: Build (with publish gate)
        run: npm run build

      - name: Assert no restricted data in artifacts
        run: |
          node -e '
          const fs = require("node:fs")
          const allowed = new Set()
          for (const dir of fs.readdirSync("cities")) {
            const file = `cities/${dir}/city.json`
            if (!fs.existsSync(file)) continue
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"))
            if (manifest.license?.redistribution === "allowed") allowed.add(manifest.id)
          }
          const published = fs.readdirSync("apps/web/dist/cities")
          const extra = published.filter((id) => !allowed.has(id))
          if (extra.length) {
            console.error("未授权城市数据进入产物：", extra.join(", "))
            process.exit(1)
          }
          if (!published.length) {
            console.error("产物中没有城市数据")
            process.exit(1)
          }
          console.log("产物城市：", published.join(", "))
          '

      - name: Assert no secrets in tree
        run: |
          set -e
          if git ls-files | grep -Ei '(\.env$|\.env\.|credentials|secret|\.pem$|id_rsa)'; then
            echo "发现疑似凭证文件"
            exit 1
          fi
          echo "未发现凭证文件"
